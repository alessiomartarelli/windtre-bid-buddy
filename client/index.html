    <link href="https://fonts.googleapis.com/css2?family=Architects+Daughter&family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=Fira+Code:wght@300..700&family=Geist+Mono:wght@100..900&family=Geist:wght@100..900&family=IBM+Plex+Mono:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;1,100;1,200;1,300;1,400;1,500;1,600;1,700&family=IBM+Plex+Sans:ital,wght@0,100..700;1,100..700&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Lora:ital,wght@0,400..700;1,400..700&family=Merriweather:ital,opsz,wght@0,18..144,300..900;1,18..144,300..900&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Open+Sans:ital,wght@0,300..800;1,300..800&family=Outfit:wght@100..900&family=Oxanium:wght@200..800&family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Roboto+Mono:ital,wght@0,100..700;1,100..700&family=Roboto:ital,wght@0,100..900;1,100..900&family=Source+Code+Pro:ital,wght@0,200..900;1,200..900&family=Source+Serif+4:ital,opsz,wght@0,8..60,200..900;1,8..60,200..900&family=Space+Grotesk:wght@300..700&family=Space+Mono:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
    <script>
      // Applica il tema PRIMA del primo paint per evitare il "flash" chiaro
      // quando l'utente ha scelto dark (o system+preferenza scura). La chiave
      // e la logica devono restare allineate a ThemeProvider.
      (function () {
        try {
          var stored = localStorage.getItem("mystoredesk-theme");
          var legacyPrisma = stored === "prisma-light";
          var theme =
            stored === "light" || stored === "dark" || stored === "system"
              ? stored
              : legacyPrisma ? "light" : "system";
          var isDark =
            theme === "dark" ||
            (theme === "system" &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.classList.toggle("dark", isDark);
          // Skin della sola Dashboard Gara Reale (Task #453). Il controllo
          // del path evita che Prisma diventi un tema globale sulle altre
          // pagine; legacyPrisma migra la preview iniziale.
          var dashboardStyle =
            localStorage.getItem("mystoredesk-dashboard-style")
            || (legacyPrisma ? "prisma-light" : "standard");
          if (
            dashboardStyle === "prisma-light"
            && /\/dashboard-gara-reale\/?$/.test(window.location.pathname)
          ) {
            document.documentElement.setAttribute("data-skin", "prisma-light");
            document.documentElement.classList.remove("dark");
          }
          // Palette brand per-utente (Task #407): applica gli override prima
          // del primo paint per evitare il flash del colore di default.
          // Mantieni preset/logica allineati a client/src/lib/appearance.ts.
          var PRESETS = {
            blue: [[221, 83, 53], [217, 91, 65]],
            teal: [[175, 84, 32], [172, 66, 50]],
            emerald: [[161, 94, 30], [158, 64, 52]],
            violet: [[262, 83, 58], [258, 90, 66]],
            fuchsia: [[293, 69, 49], [292, 84, 61]],
            rose: [[347, 77, 50], [351, 89, 64]],
            amber: [[32, 95, 44], [38, 92, 50]],
            slate: [[215, 19, 35], [215, 20, 65]],
            w3: [[25, 100, 46], [27, 98, 56]],
          };
          var rawAccent = localStorage.getItem("mystoredesk-accent");
          if (rawAccent) {
            var accent = JSON.parse(rawAccent);
            var hsl = null;
            // Task #427 — hook per stili CSS scoped al preset (parità con
            // applyAccentVars in appearance.ts, evita flash al primo paint).
            if (accent && accent.type === "preset" && (accent.id === "indigo" || PRESETS[accent.id])) {
              document.documentElement.setAttribute("data-accent", accent.id);
            } else if (accent && accent.type === "custom") {
              document.documentElement.setAttribute("data-accent", "custom");
            }
            if (accent && accent.type === "preset" && PRESETS[accent.id]) {
              hsl = PRESETS[accent.id][isDark ? 1 : 0];
            } else if (
              accent &&
              accent.type === "custom" &&
              /^#[0-9a-fA-F]{6}$/.test(accent.hex || "")
            ) {
              var n = parseInt(accent.hex.slice(1), 16);
              var r = ((n >> 16) & 255) / 255,
                g = ((n >> 8) & 255) / 255,
                b = (n & 255) / 255;
              var mx = Math.max(r, g, b),
                mn = Math.min(r, g, b),
                l = (mx + mn) / 2,
                h = 0,
                s = 0;
              if (mx !== mn) {
                var d = mx - mn;
                s = l > 0.5 ? d / (2 - mx - mn) : d / (mx + mn);
                if (mx === r) h = (g - b) / d + (g < b ? 6 : 0);
                else if (mx === g) h = (b - r) / d + 2;
                else h = (r - g) / d + 4;
                h *= 60;
              }
              var L = Math.round(l * 100);
              if (isDark) L = Math.min(L + 10, 72);
              hsl = [Math.round(h), Math.round(s * 100), L];
            }
            if (hsl) {
              var v = hsl[0] + " " + hsl[1] + "% " + hsl[2] + "%";
              var st = document.documentElement.style;
              st.setProperty("--primary", v);
              st.setProperty("--ring", v);
              st.setProperty("--brand-indigo", v);
              st.setProperty(
                "--chart-brand-soft",
                hsl[0] + " " + Math.max(hsl[1] - 25, 30) + "% " + Math.min(hsl[2] + 28, 84) + "%"
              );
              st.setProperty(
                "--chart-brand-strong",
                hsl[0] + " " + hsl[1] + "% " + Math.max(hsl[2] - 25, 18) + "%"
              );
              if (!isDark) {
                st.setProperty("--accent", hsl[0] + " 100% 97%");
                st.setProperty("--accent-foreground", hsl[0] + " 58% 38%");
              }
            }
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
