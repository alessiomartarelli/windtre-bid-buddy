location /mystoredesk {
    # Senza questa direttiva nginx applica il default di 1M e risponde 413
    # ai salvataggi grandi (es. DRMS ~13MB), prima che la richiesta arrivi
    # a Express (che ha limit 50mb). Tenere allineato in ENTRAMBI i vhost
    # sul VPS: sites-enabled/incentive-w3 e sites-enabled/onetapp.it.
    client_max_body_size 50M;
    proxy_pass http://127.0.0.1:3001;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection 'upgrade';
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_cache_bypass $http_upgrade;
    proxy_read_timeout 86400;
}

# Vecchio base path pre-rebrand MyStoreDesk (Task #274): redirect 301
# permanente al nuovo percorso, preservando sotto-path e query string.
location /incentivew3 {
    rewrite ^/incentivew3(/.*)?$ /mystoredesk$1 permanent;
}
